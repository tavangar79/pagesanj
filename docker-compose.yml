# Local / single-host stack (PRD §11). Each of backend/, web/ and admin/ is its own image and runs on its own;
# here they run side by side with MongoDB and Redis:
#   docker compose up -d --build
#   backend (API, BoxAPI webhook) :3000   web (public site) :3001   admin (panel at /admin) :8080
# Secrets come from backend/.env and web/.env (templates: .env.example in each); service URLs are set here.

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: pagesanj/backend
  env_file:
    - path: backend/.env
      required: false
  environment:
    NODE_ENV: production
    PORT: 3000
    MONGODB_URI: mongodb://mongo:27017/pagesanj
    REDIS_URL: redis://redis:6379
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  backend:
    <<: *backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: pagesanj/web
    env_file:
      - path: web/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3001
      API_URL: http://backend:3000
    ports:
      - "${WEB_PORT:-3001}:3001"
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    image: pagesanj/admin
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "${ADMIN_PORT:-8080}:8080"
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    ports:
      - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # BullMQ needs noeviction (see backend/.env.example)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports:
      - "6377:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
